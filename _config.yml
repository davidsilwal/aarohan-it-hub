# Aarohan IT Hub - Site Configuration
# Modern, minimalist Jekyll configuration

title: Aarohan IT Hub
logo: /assets/images/aarohan-logo.svg
description: "Aarohan IT Hub - Enterprise-grade software engineering, cloud architecture, and IT consulting in Kathmandu, Nepal."
url: "https://aarohanithub.com.np"
baseurl: ""

# Company Details
company:
  name: Aarohan IT Hub
  tagline: "Empowering Businesses with Modern Technology Solutions"
  location: "Kathmandu, Nepal"
  address: "SuNepal Plaza, 3rd Floor, Kathmandu, Nepal"
  email: "contact@aarohanithub.com.np"
  phone: "+977 1 4420000"
  hours: "Sunday – Friday: 9:00 AM – 6:00 PM NPT"
  github: "https://github.com/aarohanithub"
  linkedin: "https://linkedin.com/company/aarohanithub"

# Social Metadata
social:
  name: Aarohan IT Hub
  links:
    - https://github.com/aarohanithub

# Author
author:
  name: Aarohan IT Hub Team
  url: "https://aarohanithub.com.np"

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Plugins
plugins:
  - jekyll-sitemap

# Exclude from processing
exclude:
  - .git
  - .github
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    block_lenient_third_party_processors: false

# Sass
sass:
  style: compressed
