---
layout: default
---

<div class="page-wrapper">
  <header class="page-hero">
    <div class="container">
      {% if page.badge %}
        <span class="eyebrow-badge">{{ page.badge }}</span>
      {% endif %}
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.excerpt %}
        <p class="page-lead">{{ page.excerpt }}</p>
      {% endif %}
    </div>
  </header>

  <div class="page-content">
    {{ content }}
  </div>
</div>
