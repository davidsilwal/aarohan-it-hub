<header class="site-header" id="site-header">
  <div class="container header-container">
    <a href="{{ '/' | relative_url }}" class="brand-link" aria-label="Aarohan IT Hub Home">
      <img src="{{ '/assets/images/aarohan-logo.svg' | relative_url }}" alt="Aarohan IT Hub" class="brand-logo" width="180" height="36">
    </a>

    <nav class="site-nav" id="nav-menu" aria-label="Main Navigation">
      <ul class="nav-list">
        <li>
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active" aria-current="page"{% endif %}>Home</a>
        </li>
        <li>
          <a href="{{ '/services/' | relative_url }}" {% if page.url contains 'services' %}class="active" aria-current="page"{% endif %}>Services</a>
        </li>
        <li>
          <a href="{{ '/projects/' | relative_url }}" {% if page.url contains 'projects' %}class="active" aria-current="page"{% endif %}>Projects</a>
        </li>
        <li>
          <a href="{{ '/about/' | relative_url }}" {% if page.url contains 'about' %}class="active" aria-current="page"{% endif %}>About</a>
        </li>
        <li>
          <a href="{{ '/contact/' | relative_url }}" {% if page.url contains 'contact' %}class="active" aria-current="page"{% endif %}>Contact</a>
        </li>
      </ul>
    </nav>

    <div class="header-actions">
      <a href="{{ '/contact/' | relative_url }}" class="btn btn-sm btn-primary header-cta">Work With Us</a>
      <button class="mobile-toggle" id="mobile-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav-menu">
        <span class="toggle-bar"></span>
        <span class="toggle-bar"></span>
        <span class="toggle-bar"></span>
      </button>
    </div>
  </div>
</header>
