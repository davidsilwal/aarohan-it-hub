<header class="sticky top-0 z-50 bg-white/85 backdrop-blur-md border-b border-slate-200/80 transition-shadow duration-200" id="site-header">
  <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    
    <!-- Brand Logo -->
    <a href="{{ '/' | relative_url }}" class="flex items-center transition-opacity hover:opacity-90" aria-label="Aarohan IT Hub Home">
      <img src="{{ '/assets/images/aarohan-logo.svg' | relative_url }}" alt="Aarohan IT Hub" class="h-8 w-auto" width="160" height="32">
    </a>

    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center gap-1" aria-label="Main Navigation">
      <a href="{{ '/' | relative_url }}" class="px-3.5 py-1.5 text-sm font-medium rounded-lg transition-colors {% if page.url == '/' %}text-sky-700 font-semibold bg-sky-50 ring-1 ring-sky-200/70{% else %}text-slate-600 hover:text-slate-950 hover:bg-slate-100/80{% endif %}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/services/' | relative_url }}" class="px-3.5 py-1.5 text-sm font-medium rounded-lg transition-colors {% if page.url contains 'services' %}text-sky-700 font-semibold bg-sky-50 ring-1 ring-sky-200/70{% else %}text-slate-600 hover:text-slate-950 hover:bg-slate-100/80{% endif %}" {% if page.url contains 'services' %}aria-current="page"{% endif %}>Services</a>
      <a href="{{ '/projects/' | relative_url }}" class="px-3.5 py-1.5 text-sm font-medium rounded-lg transition-colors {% if page.url contains 'projects' %}text-sky-700 font-semibold bg-sky-50 ring-1 ring-sky-200/70{% else %}text-slate-600 hover:text-slate-950 hover:bg-slate-100/80{% endif %}" {% if page.url contains 'projects' %}aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/about/' | relative_url }}" class="px-3.5 py-1.5 text-sm font-medium rounded-lg transition-colors {% if page.url contains 'about' %}text-sky-700 font-semibold bg-sky-50 ring-1 ring-sky-200/70{% else %}text-slate-600 hover:text-slate-950 hover:bg-slate-100/80{% endif %}" {% if page.url contains 'about' %}aria-current="page"{% endif %}>About</a>
      <a href="{{ '/contact/' | relative_url }}" class="px-3.5 py-1.5 text-sm font-medium rounded-lg transition-colors {% if page.url contains 'contact' %}text-sky-700 font-semibold bg-sky-50 ring-1 ring-sky-200/70{% else %}text-slate-600 hover:text-slate-950 hover:bg-slate-100/80{% endif %}" {% if page.url contains 'contact' %}aria-current="page"{% endif %}>Contact</a>
    </nav>

    <!-- Header CTA & Mobile Button -->
    <div class="flex items-center gap-3">
      <a href="{{ '/contact/' | relative_url }}" class="hidden sm:inline-flex items-center justify-center px-4 py-1.5 text-sm font-semibold text-white bg-sky-600 hover:bg-sky-700 rounded-lg shadow-xs hover:shadow-sm hover:shadow-sky-500/20 transition-all">
        Work With Us
      </a>
      
      <button class="md:hidden flex flex-col justify-center items-center w-9 h-9 rounded-lg border border-slate-200 text-slate-700 hover:bg-slate-100 focus:outline-hidden focus:ring-2 focus:ring-sky-500" id="mobile-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobile-nav">
        <span class="w-4 h-0.5 bg-current rounded-full transition-transform duration-200 origin-center my-0.5" id="bar-1"></span>
        <span class="w-4 h-0.5 bg-current rounded-full transition-opacity duration-200 my-0.5" id="bar-2"></span>
        <span class="w-4 h-0.5 bg-current rounded-full transition-transform duration-200 origin-center my-0.5" id="bar-3"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Navigation -->
  <div class="hidden md:hidden border-b border-slate-200 bg-white/95 backdrop-blur-lg px-4 pt-2 pb-4 shadow-xl transition-all" id="mobile-nav">
    <div class="flex flex-col gap-1">
      <a href="{{ '/' | relative_url }}" class="px-3 py-2 text-base font-medium rounded-lg {% if page.url == '/' %}text-sky-700 font-semibold bg-sky-50{% else %}text-slate-700 hover:bg-slate-100{% endif %}">Home</a>
      <a href="{{ '/services/' | relative_url }}" class="px-3 py-2 text-base font-medium rounded-lg {% if page.url contains 'services' %}text-sky-700 font-semibold bg-sky-50{% else %}text-slate-700 hover:bg-slate-100{% endif %}">Services</a>
      <a href="{{ '/projects/' | relative_url }}" class="px-3 py-2 text-base font-medium rounded-lg {% if page.url contains 'projects' %}text-sky-700 font-semibold bg-sky-50{% else %}text-slate-700 hover:bg-slate-100{% endif %}">Projects</a>
      <a href="{{ '/about/' | relative_url }}" class="px-3 py-2 text-base font-medium rounded-lg {% if page.url contains 'about' %}text-sky-700 font-semibold bg-sky-50{% else %}text-slate-700 hover:bg-slate-100{% endif %}">About</a>
      <a href="{{ '/contact/' | relative_url }}" class="px-3 py-2 text-base font-medium rounded-lg {% if page.url contains 'contact' %}text-sky-700 font-semibold bg-sky-50{% else %}text-slate-700 hover:bg-slate-100{% endif %}">Contact</a>
      <div class="pt-2 mt-1 border-t border-slate-100">
        <a href="{{ '/contact/' | relative_url }}" class="w-full flex items-center justify-center px-4 py-2 text-sm font-semibold text-white bg-sky-600 hover:bg-sky-700 rounded-lg shadow-xs">
          Schedule Consultation
        </a>
      </div>
    </div>
  </div>
</header>
